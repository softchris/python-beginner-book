{% extends 'base.html' %}
{% block content %}


<h2>Products</h2>
<div class="product-list">
{% if not products %}
    <p>No products available at the moment.</p>
{% endif %}

{% for product in products %}
    <div class="product-item">
        <h3>{{ product.name }}</h3>
        <p>Price: ${{ product.price }}</p>
    </div>
{% endfor %}    

</div>

{% endblock %}
